<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Share - Rent or Buy Laptops</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">Tech Share</div>
        <nav class="nav-links">
            <a href="#rent">Rent</a>
            <a href="#buy">Buy</a>
            <a href="#sustainability">Sustainability</a>
            <a href="#about">About Us</a>
        </nav>
        <div class="nav-actions">
            <button class="btn-text">Log In</button>
            <button class="btn-primary-sm">Get Started</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-left">
            <span class="animated-brand">Tech Share</span>
            <h1 class="hero-title">
                RENT OR BUY:<br>
                YOUR NEXT DEVICE,<br>
                SIMPLIFIED.
            </h1>
            <p class="hero-subtitle">
                AFFORDABLE LAPTOP RENTALS.<br>
                QUALITY USED COMPUTERS FOR PURCHASE.
            </p>
            <div class="hero-cta">
                <button class="btn-hero-primary">START RENTING</button>
                <button class="btn-hero-outline">EXPLORE DEVICES</button>
            </div>
        </div>

        <div class="hero-right">
            <!-- Background Graphic Cards -->
            <div class="glass-card stat-card-1">
                <h4>Sustainability and resenning</h4>
                <div class="chart-line"></div>
            </div>
            <div class="glass-card stat-card-2">
                <h4>Tech Access</h4>
                <div class="chart-bars">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- Device Showcase Container -->
            <div class="device-showcase">
                <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80" alt="Laptops Showcase" class="device-img">
                
                <!-- Floating Badges -->
                <div class="badge badge-rental">
                    <span class="icon">📅</span>
                    <span>Rental</span>
                </div>
                <div class="badge badge-buy">
                    <span class="icon">🛒</span>
                    <span>Buy</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Section for Scrolling -->
    <section class="content-section" id="rent">
        <h2>Explore Our Catalog</h2>
        <p>Premium quality hardware at flexible pricing.</p>
    </section>

</body>
</html>
